version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: node src/api/server.js
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-1:
    build: .
    command: node src/worker/index.js
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker-1
      - WORKER_CONCURRENCY=5
      - VISIBILITY_TIMEOUT_MS=30000
      - HEARTBEAT_INTERVAL_MS=5000
      - SCHEDULER_INTERVAL_MS=2000
      - REAPER_INTERVAL_MS=10000
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build: .
    command: node src/worker/index.js
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker-2
      - WORKER_CONCURRENCY=5
      - VISIBILITY_TIMEOUT_MS=30000
      - HEARTBEAT_INTERVAL_MS=5000
      - SCHEDULER_INTERVAL_MS=2000
      - REAPER_INTERVAL_MS=10000
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-3:
    build: .
    command: node src/worker/index.js
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker-3
      - WORKER_CONCURRENCY=5
      - VISIBILITY_TIMEOUT_MS=30000
      - HEARTBEAT_INTERVAL_MS=5000
      - SCHEDULER_INTERVAL_MS=2000
      - REAPER_INTERVAL_MS=10000
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

